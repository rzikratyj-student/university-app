name: Campus checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CAMPUS_LOAD_DOTENV: "0"

concurrency:
  group: campus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-and-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: SQLite tests
        env:
          DATABASE_URL: "sqlite://"
          TEST_DATABASE_URL: "sqlite://"
        run: python -m pytest -q
      - name: JavaScript syntax
        run: node --check app/static/js/app.js
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Compose syntax (no startup, no secrets rendered)
        run: docker compose -p campus-compose-dev config --quiet

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ephemeral PostgreSQL 18, migrations and tests
        # Generates a one-use password in memory and a temporary file.
        # Does not need repository secrets; safe to run on fork PRs.
        run: python scripts/ci_postgres.py
